[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drex-pr-shepherd"
version = "0.1.0"
description = "Post-submission pull request lifecycle manager: watch, classify, route bounded repairs, re-verify, track settlement separately."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
drex-shepherd = "pr_shepherd.cli.main:main"

[tool.setuptools.packages.find]
include = ["pr_shepherd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
